name = "feedometer-api"
main = "workers/feedometer-worker.js"
compatibility_date = "2024-09-01"

# -------------------------------------------------------------
# DEFAULT ENVIRONMENT (BACKUP ACCOUNT)
# -------------------------------------------------------------

[vars]
ENVIRONMENT = "development"
WORKER_PUBLIC_URL = "http://localhost:8787"
ADMIN_NOTIFY_EMAIL = "admin@feedometer.com"

[[d1_databases]]
binding = "DB"
database_name = "feedometer-db"
database_id = "ca5fb7fa-600e-456a-b904-080229328089"

[[kv_namespaces]]
binding = "FEEDS_KV"
id = "fc5db18ac3b04d05817218ffd36c5fcb"

[observability]

[observability.logs]
enabled = true
invocation_logs = true
persist = true
