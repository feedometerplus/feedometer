name = "feedometer-api"
main = "workers/feedometer-worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
account_id = "f77f476d7ae23ede65d465856c3b29a4"

[vars]
ENVIRONMENT = "production"
ADMIN_NOTIFY_EMAIL = "admin@feedometer.com"
GOOGLE_CLIENT_ID = "519822758554-19n3plblqq2nqago9r619kg5bi265674.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "feedometer-db"
database_id = "ca5fb7fa-600e-456a-b904-080229328089"

[[kv_namespaces]]
binding = "FEEDS_KV"
id = "fc5db18ac3b04d05817218ffd36c5fcb"

# Browser Rendering for Visual Builder (JS-heavy sites). Enable in Cloudflare dashboard first.
[browser]
binding = "BROWSER"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Scheduled crons: warm-cache every 4 hours; waitlist KV→D1 sync daily at 13:00 UTC (7:00 PM IST)
[triggers]
crons = ["0 */4 * * *", "0 13 * * *"]

